name: Update SDN addresses

on:
  schedule:
    # ~09:00 UTC so the feed is usually ready before Meridian (~13:15 UTC).
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: sdn-feed-update
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Extract OFAC digital currency addresses
        run: python3 scripts/extract_sdn.py --output-dir data

      - name: Commit feed and heartbeat
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sdn-addresses.json data/sdn-addresses.json.sha256 data/last-run.json
          if git diff --cached --quiet; then
            echo "No feed or heartbeat changes to commit"
            exit 0
          fi
          git commit -m "chore: refresh OFAC SDN digital currency addresses"
          # Same extraheader form actions/checkout uses. Do not echo BASIC.
          BASIC="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${BASIC}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${BASIC}" \
            push origin "HEAD:${GITHUB_REF_NAME}"
          unset BASIC
